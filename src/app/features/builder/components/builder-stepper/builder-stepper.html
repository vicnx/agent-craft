<nav class="grid grid-cols-4 gap-1 sm:gap-1.5 p-1 rounded-xl bg-white/[0.03] border border-white/[0.08] w-full" aria-label="Builder steps">
  @for (step of steps; track step.id) {
    <button
      type="button"
      (click)="selectStep(step.id)"
      [attr.aria-current]="currentStep() === step.id ? 'step' : null"
      [attr.aria-label]="step.labelKey | translate"
      [class.bg-brand-primary/15]="currentStep() === step.id"
      [class.text-brand-primary]="currentStep() === step.id"
      [class.border-brand-primary/40]="currentStep() === step.id"
      [class.shadow-sm]="currentStep() === step.id"
      [class.text-slate-400]="currentStep() !== step.id"
      [class.border-transparent]="currentStep() !== step.id"
      class="relative flex items-center justify-center gap-1.5 px-2 py-2 sm:px-2.5 sm:py-2 rounded-lg text-xs font-medium border transition-all cursor-pointer hover:text-white hover:bg-white/[0.04]"
    >
      <i [class]="step.icon" class="text-xs shrink-0"></i>
      <span class="hidden sm:inline whitespace-nowrap font-semibold">{{ step.labelKey | translate }}</span>

      @if (getStepBadge(step.id) > 0) {
        <span class="hidden md:inline-flex px-1.5 py-0.2 rounded-full text-[10px] font-mono bg-brand-primary/20 text-brand-primary shrink-0 font-semibold">
          {{ getStepBadge(step.id) }}
        </span>
        <span class="md:hidden absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-brand-primary"></span>
      }
    </button>
  }
</nav>
