<nav class="grid grid-cols-6 gap-1 p-1 rounded-xl bg-white/[0.03] border border-white/[0.08] w-full" aria-label="Builder steps">
  @for (step of steps; track step.id) {
    <button
      type="button"
      (click)="selectStep(step.id)"
      [attr.aria-current]="currentStep() === step.id ? 'step' : null"
      [attr.aria-label]="step.labelKey | translate"
      [attr.title]="step.labelKey | translate"
      [class.bg-brand-primary/15]="currentStep() === step.id"
      [class.text-brand-primary]="currentStep() === step.id"
      [class.border-brand-primary/40]="currentStep() === step.id"
      [class.shadow-sm]="currentStep() === step.id"
      [class.text-slate-400]="currentStep() !== step.id"
      [class.border-transparent]="currentStep() !== step.id"
      class="group relative flex items-center justify-center py-2.5 px-2 rounded-lg font-medium border transition-all cursor-pointer hover:text-white hover:bg-white/[0.04]"
    >
      <i [class]="step.icon" class="text-sm sm:text-base shrink-0"></i>

      @if (getStepBadge(step.id) > 0) {
        <span class="absolute top-1 right-1.5 flex h-3.5 min-w-[14px] px-1 items-center justify-center rounded-full text-[9px] font-mono font-bold bg-brand-primary text-white shadow-sm">
          {{ getStepBadge(step.id) }}
        </span>
      }

      <span
        role="tooltip"
        class="pointer-events-none absolute top-full mt-2 left-1/2 -translate-x-1/2 px-2.5 py-1 rounded-md bg-slate-900/95 backdrop-blur-md border border-white/10 text-[11px] font-medium text-slate-200 shadow-xl shadow-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-150 z-30 whitespace-nowrap"
      >
        {{ step.labelKey | translate }}
      </span>
    </button>
  }
</nav>
