@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md transition-opacity duration-200"
    (click)="onCancel()"
    (keydown.escape)="onCancel()"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
  >
    <div
      class="glass-panel w-full max-w-md rounded-2xl p-6 border border-white/10 shadow-2xl relative space-y-5"
      (click)="$event.stopPropagation()"
    >
      <!-- Modal Header with Warning Icon -->
      <div class="flex items-start gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div class="space-y-1">
          <h3 class="text-sm font-semibold text-white tracking-tight">
            {{ title() }}
          </h3>
          <p class="text-xs text-slate-400 leading-relaxed">
            {{ message() }}
          </p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-2.5 pt-2 border-t border-white/[0.06]">
        <button
          type="button"
          (click)="onCancel()"
          class="btn-secondary text-xs py-1.5 px-3.5"
        >
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg shadow-amber-500/20 transition-all cursor-pointer"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
