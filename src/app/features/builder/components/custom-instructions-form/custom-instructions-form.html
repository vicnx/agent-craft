<div class="space-y-4 pt-4 border-t border-slate-200/80 dark:border-white/[0.06]">
  <!-- Section Title & Subtitle -->
  <div class="flex items-center justify-between">
    <div>
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400">
        {{ 'builder.customInstructionsTitle' | translate }}
      </h3>
      <p class="text-xs text-slate-400 dark:text-slate-500">{{ 'builder.customInstructionsSubtitle' | translate }}</p>
    </div>
    <div class="flex items-center gap-2">
      @if (agentConfig.config().customInstructions) {
        <button
          type="button"
          (click)="clear()"
          class="text-[11px] text-slate-500 dark:text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors cursor-pointer"
        >
          {{ 'builder.clearAll' | translate }}
        </button>
      }
      <span class="badge-brand text-[10px]">{{ 'builder.badgeCustom' | translate }}</span>
    </div>
  </div>

  <!-- Custom Instructions Textarea -->
  <div>
    <label for="custom-instructions-input" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-2">
      {{ 'builder.customInstructionsLabel' | translate }}
    </label>
    <textarea
      id="custom-instructions-input"
      rows="4"
      [value]="agentConfig.config().customInstructions"
      (input)="onInput($event)"
      [placeholder]="'builder.customInstructionsPlaceholder' | translate"
      class="input-field w-full text-xs font-mono resize-y min-h-[100px] leading-relaxed"
    ></textarea>
  </div>
</div>
