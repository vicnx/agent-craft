<div class="space-y-4 pt-4 border-t border-white/[0.06]">
  <!-- Section Title & Subtitle -->
  <div class="flex items-center justify-between">
    <div>
      <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
        {{ 'builder.workflowTitle' | translate }}
      </h3>
      <p class="text-xs text-slate-500">{{ 'builder.workflowSubtitle' | translate }}</p>
    </div>
    <span class="badge-brand text-[10px]">{{ 'builder.badgeGit' | translate }}</span>
  </div>

  <!-- Git Convention Input Field -->
  <div>
    <label for="git-convention-input" class="block text-xs font-medium text-slate-300 mb-2">
      {{ 'builder.gitConventionLabel' | translate }}
    </label>
    <input
      id="git-convention-input"
      type="text"
      [value]="agentConfig.config().gitConvention"
      (input)="onInput($event)"
      [placeholder]="'builder.gitConventionPlaceholder' | translate"
      class="input-field w-full text-xs font-mono"
    />
  </div>

  <!-- Quick Convention Presets -->
  <div class="space-y-2">
    <span class="text-[11px] text-slate-400 font-medium">
      {{ 'builder.quickConventions' | translate }}
    </span>
    <div class="flex flex-wrap gap-1.5">
      @for (preset of presets; track preset) {
        <button
          type="button"
          (click)="selectPreset(preset)"
          [class.bg-indigo-500/20]="isSelected(preset)"
          [class.text-indigo-300]="isSelected(preset)"
          [class.border-indigo-500/50]="isSelected(preset)"
          [class.bg-white/[0.03]]="!isSelected(preset)"
          [class.text-slate-400]="!isSelected(preset)"
          [class.border-white/[0.06]]="!isSelected(preset)"
          class="text-[11px] font-mono px-2.5 py-1 rounded-lg border transition-all hover:text-white hover:border-white/20 hover:bg-white/[0.06] cursor-pointer"
        >
          {{ preset }}
        </button>
      }
    </div>
  </div>
</div>
