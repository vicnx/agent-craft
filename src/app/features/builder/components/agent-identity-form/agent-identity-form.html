<div class="space-y-5">
  <!-- Project Name Field -->
  <div>
    <label for="projectNameInput" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-2">
      {{ 'builder.projectNameLabel' | translate }}
    </label>
    <input
      id="projectNameInput"
      type="text"
      [value]="agentConfig.config().projectName"
      (input)="onProjectNameChange($event)"
      [placeholder]="'builder.projectNamePlaceholder' | translate"
      class="input-field w-full text-xs font-mono"
    />
  </div>

  <!-- Agent Role Field -->
  <div>
    <label for="roleInput" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-2">
      {{ 'builder.roleLabel' | translate }}
    </label>
    <input
      id="roleInput"
      type="text"
      [value]="agentConfig.config().role"
      (input)="onRoleChange($event)"
      [placeholder]="'builder.rolePlaceholder' | translate"
      class="input-field w-full text-xs font-mono"
    />

    <!-- Role Suggestions Pills -->
    <div class="space-y-1.5 pt-2">
      <div class="flex items-center justify-between">
        <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">
          {{ 'builder.quickRoles' | translate }}
        </span>
        @if (allRoles().length > 4) {
          <button
            type="button"
            (click)="toggleShowAllRoles()"
            class="text-[11px] text-brand-primary hover:text-brand-secondary transition-colors cursor-pointer font-medium"
          >
            {{ (showAllRoles() ? 'builder.showLessRoles' : 'builder.showMoreRoles') | translate }}
          </button>
        }
      </div>
      <div class="flex flex-wrap gap-1.5">
        @for (role of visibleRoles(); track role) {
          <button
            type="button"
            (click)="selectRole(role)"
            [class.chip-active]="agentConfig.config().role === role"
            [class.chip-item]="agentConfig.config().role !== role"
            class="text-[11px] px-2.5 py-1 rounded-lg text-left"
          >
            {{ role }}
          </button>
        }
      </div>
    </div>
  </div>

  <!-- Output Language Toggle -->
  <div>
    <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-2">
      {{ 'builder.outputLanguageLabel' | translate }}
    </label>
    <div class="inline-flex w-full sm:w-auto p-1 rounded-xl bg-slate-100/80 dark:bg-white/[0.03] border border-slate-200 dark:border-white/[0.08]">
      <button
        type="button"
        (click)="setOutputLanguage('es')"
        [class.bg-brand-primary]="agentConfig.config().outputLanguage === 'es'"
        [class.text-white]="agentConfig.config().outputLanguage === 'es'"
        [class.text-slate-500]="agentConfig.config().outputLanguage !== 'es'"
        [class.dark:text-slate-400]="agentConfig.config().outputLanguage !== 'es'"
        class="flex-1 sm:flex-initial text-center px-4 py-1.5 rounded-lg text-xs font-medium transition-all hover:text-slate-900 dark:hover:text-white cursor-pointer whitespace-nowrap"
      >
        {{ 'builder.outputLangEs' | translate }}
      </button>
      <button
        type="button"
        (click)="setOutputLanguage('en')"
        [class.bg-brand-primary]="agentConfig.config().outputLanguage === 'en'"
        [class.text-white]="agentConfig.config().outputLanguage === 'en'"
        [class.text-slate-500]="agentConfig.config().outputLanguage !== 'en'"
        [class.dark:text-slate-400]="agentConfig.config().outputLanguage !== 'en'"
        class="flex-1 sm:flex-initial text-center px-4 py-1.5 rounded-lg text-xs font-medium transition-all hover:text-slate-900 dark:hover:text-white cursor-pointer whitespace-nowrap"
      >
        {{ 'builder.outputLangEn' | translate }}
      </button>
    </div>
  </div>

  <!-- Mission / Description Field (Compact 1-line input) -->
  <div>
    <label for="descriptionInput" class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-2">
      {{ 'builder.descriptionLabel' | translate }}
    </label>
    <input
      id="descriptionInput"
      type="text"
      [value]="agentConfig.config().description"
      (input)="onDescriptionChange($event)"
      [placeholder]="'builder.descriptionPlaceholder' | translate"
      class="input-field w-full text-xs font-mono"
    />
  </div>
</div>
