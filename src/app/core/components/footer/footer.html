<footer class="border-t border-slate-200/80 dark:border-white/[0.08] bg-canvas/60 backdrop-blur-xl py-6 mt-auto">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
    <!-- Author Attribution -->
    <div class="flex items-center gap-1.5">
      <span>{{ 'footer.createdWith' | translate }}</span>
      <i class="fa-solid fa-heart text-rose-500 animate-pulse text-xs" aria-hidden="true"></i>
      <span>{{ 'footer.by' | translate }}</span>
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noreferrer noopener"
        class="font-semibold text-slate-700 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
      >
        {{ 'footer.author' | translate }}
      </a>
    </div>

    <!-- Center License Tag -->
    <div class="flex items-center gap-2 text-slate-400 dark:text-slate-500">
      <span class="font-mono">{{ 'footer.license' | translate }}</span>
      <span>·</span>
      <span class="font-mono">AgentCraft Studio</span>
    </div>

    <!-- Social Links (GitHub & LinkedIn) -->
    <div class="flex items-center gap-3">
      <!-- GitHub Link -->
      <a
        [href]="githubUrl"
        target="_blank"
        rel="noreferrer noopener"
        [attr.aria-label]="'footer.githubAria' | translate"
        class="w-8 h-8 rounded-lg bg-slate-100/80 dark:bg-white/[0.04] border border-slate-200 dark:border-white/[0.08] hover:border-indigo-500/40 hover:bg-slate-200/60 dark:hover:bg-white/[0.08] text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition-all"
      >
        <i class="fa-brands fa-github text-sm"></i>
      </a>

      <!-- LinkedIn Link -->
      <a
        [href]="linkedinUrl"
        target="_blank"
        rel="noreferrer noopener"
        [attr.aria-label]="'footer.linkedinAria' | translate"
        class="w-8 h-8 rounded-lg bg-slate-100/80 dark:bg-white/[0.04] border border-slate-200 dark:border-white/[0.08] hover:border-indigo-500/40 hover:bg-slate-200/60 dark:hover:bg-white/[0.08] text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition-all"
      >
        <i class="fa-brands fa-linkedin-in text-sm"></i>
      </a>
    </div>
  </div>
</footer>
